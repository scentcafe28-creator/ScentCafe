  <script>
    const app = document.getElementById('app');
    const API_BASE_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
      ? 'http://localhost:3000'
      : window.location.origin;

    const defaultCategories = [
      { key: 'government', title: 'Government', icon: '🏛️', description: 'SASSA, Home Affairs, SARS, NSFAS and more.' },
      { key: 'jobs', title: 'Jobs & CVs', icon: '💼', description: 'CVs, applications and interviews.' },
      { key: 'education', title: 'Education', icon: '🎓', description: 'Admissions and student support services.' },
      { key: 'applications', title: 'Applications', icon: '📄', description: 'Online forms and document help.' }
    ];

    const defaultNotifications = [
      { id: 1, title: 'Request received', detail: 'Your Government request is now in review.', createdAt: new Date().toISOString() },
      { id: 2, title: 'Profile update', detail: 'Your contact details were saved successfully.', createdAt: new Date(Date.now() - 3600000).toISOString() },
      { id: 3, title: 'Service reminder', detail: 'Need support with a document? Submit a new request today.', createdAt: new Date(Date.now() - 86400000).toISOString() }
    ];

    function getToken() {
      return localStorage.getItem('scentcafe_token');
    }

    function saveToken(token) {
      localStorage.setItem('scentcafe_token', token);
    }

    function clearSession() {
      localStorage.removeItem('scentcafe_token');
      localStorage.removeItem('scentcafe_session');
    }

    function getAccount() {
      const saved = JSON.parse(localStorage.getItem('scentcafeAccount') || 'null');
      if (saved) return saved;

      return {
        name: 'Customer',
        email: 'customer@scentcafe.com',
        password: 'password123',
        emailAlerts: true,
        smsAlerts: true,
        preferredCategories: ['government', 'jobs']
      };
    }

    function saveAccount(account) {
      localStorage.setItem('scentcafeAccount', JSON.stringify(account));
    }

    function getNotifications() {
      const notifications = JSON.parse(localStorage.getItem('scentcafeNotifications') || 'null');
      if (Array.isArray(notifications) && notifications.length) return notifications;
      localStorage.setItem('scentcafeNotifications', JSON.stringify(defaultNotifications));
      return defaultNotifications;
    }

    function addNotification(title, detail) {
      const notifications = getNotifications();
      notifications.unshift({
        id: Date.now(),
        title,
        detail,
        createdAt: new Date().toISOString()
      });

      localStorage.setItem('scentcafeNotifications', JSON.stringify(notifications.slice(0, 8)));
    }

    function getTickets() {
      return JSON.parse(localStorage.getItem('scentcafeRequests') || '[]');
    }

    function saveTickets(data) {
      localStorage.setItem('scentcafeRequests', JSON.stringify(data));
    }

    function apiRequest(path, options = {}) {
      const token = getToken();
      const headers = { ...(options.headers || {}) };

      if (!(options.body instanceof FormData)) {
        headers['Content-Type'] = headers['Content-Type'] || 'application/json';
      }

      if (token) {
        headers.Authorization = `Bearer ${token}`;
      }

      return fetch(`${API_BASE_URL}${path}`, {
        ...options,
        headers
      }).then(async (response) => {
        const contentType = response.headers.get('content-type') || '';
        const data = contentType.includes('application/json')
          ? await response.json().catch(() => ({}))
          : await response.text().catch(() => '');

        if (!response.ok) {
          throw new Error((data && data.message) || 'Request failed');
        }

        return data;
      });
    }

    function persistSession(user, token) {
      saveToken(token);
      localStorage.setItem('scentcafe_session', JSON.stringify({
        name: user.name || user.firstName || 'Customer',
        email: user.email || getAccount().email
      }));
    }

    function renderError(message) {
      const existing = document.querySelector('.error');
      if (existing) existing.remove();

      const errorBox = document.createElement('div');
      errorBox.className = 'error';
      errorBox.textContent = message;
      app.prepend(errorBox);
    }

    function renderLogin() {
      app.innerHTML = `
        <div class="card">
          <div class="badge">Secure login</div>
          <h1>Welcome back</h1>
          <p class="subtitle">Sign in to manage your requests, services and account details.</p>

          <label>Email address</label>
          <input id="email" type="email" placeholder="name@example.com" />

          <label>Password</label>
          <input id="password" type="password" placeholder="Enter your password" />

          <button class="primary" id="loginBtn">Sign In</button>
          <button class="secondary" id="signupBtn">Create account</button>

          <div class="demo-box">
            Demo login:<br>
            Email: customer@scentcafe.com<br>
            Password: password123<br>
            Admin login:<br>
            Email: admin@scentcafe.com<br>
            Password: admin123
          </div>
        </div>
      `;

      document.getElementById('loginBtn').addEventListener('click', async () => {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!email || !password) {
          renderError('Please complete all fields.');
          return;
        }

        try {
          const data = await apiRequest('/api/login', {
            method: 'POST',
            body: JSON.stringify({ email, password })
          });

          persistSession(data.user, data.token);
          renderHome();
        } catch (error) {
          renderError(error.message || 'Incorrect email or password.');
        }
      });

      document.getElementById('signupBtn').addEventListener('click', () => renderSignup());
    }

    function renderSignup() {
      app.innerHTML = `
        <div class="card">
          <div class="badge">Create account</div>
          <h1>Join ScentCafe</h1>
          <p class="subtitle">Register to access services and manage your requests.</p>

          <label>Full name</label>
          <input id="fullName" placeholder="Your full name" />

          <label>Email address</label>
          <input id="newEmail" type="email" placeholder="name@example.com" />

          <label>Password</label>
          <input id="newPassword" type="password" placeholder="Create a password" />

          <button class="primary" id="createBtn">Create account</button>
          <button class="secondary" id="backBtn">Back to sign in</button>
        </div>
      `;

      document.getElementById('createBtn').addEventListener('click', async () => {
        const firstName = document.getElementById('fullName').value.trim().split(' ')[0] || '';
        const lastName = document.getElementById('fullName').value.trim().split(' ').slice(1).join(' ') || '';
        const email = document.getElementById('newEmail').value.trim();
        const password = document.getElementById('newPassword').value;

        if (!firstName || !lastName || !email || !password) {
          renderError('Please complete all fields.');
          return;
        }

        try {
          const data = await apiRequest('/api/signup', {
            method: 'POST',
            body: JSON.stringify({ firstName, lastName, email, password })
          });

          persistSession(data.user, data.token);
          renderHome();
        } catch (error) {
          renderError(error.message || 'Unable to create account.');
        }
      });

      document.getElementById('backBtn').addEventListener('click', renderLogin);
    }

    function serviceCategoryMarkup() {
      return defaultCategories.map((category) => `
        <div class="category-card" data-category="${category.key}" tabindex="0">
          <div>
            <div class="category-icon">${category.icon}</div>
            <h4>${category.title}</h4>
          </div>
          <p>${category.description}</p>
        </div>
      `).join('');
    }

    function renderHome() {
      const user = JSON.parse(localStorage.getItem('scentcafe_session') || '{"name":"Customer","email":"customer@scentcafe.com"}');
      const notifications = getNotifications().slice(0, 3);

      app.innerHTML = `
        <div>
          <div class="card" style="margin-bottom:18px;">
            <div class="summary-row">
              <h2 style="margin:0; color: var(--gold);">Welcome to ScentCafe</h2>
              <span class="pill">${notifications.length}</span>
            </div>
            <p class="subtitle">Hello ${user.name || 'there'}! Your digital service centre.</p>
            <button class="primary" id="requestBtn">Make a request</button>
          </div>

          <div class="notification-box">
            <div class="summary-row">
              <h3 style="margin:0; color: var(--gold);">Notifications</h3>
              <button class="secondary" id="notificationLink" style="margin:0; width:auto; padding:8px 12px; font-size:0.85rem;">View all</button>
            </div>
            <div class="notification-list">
              ${notifications.map((note) => `
                <div class="notification-item">
                  <strong>${note.title}</strong>
                  <div class="small" style="margin-top:6px;">${note.detail}</div>
                  <div class="small" style="margin-top:6px;">${new Date(note.createdAt).toLocaleDateString()}</div>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="request-box">
            <h3 style="color: var(--gold); margin-bottom:10px;">Popular service categories</h3>
            <div class="category-grid">
              ${serviceCategoryMarkup()}
            </div>
          </div>

          <button class="secondary" id="logoutBtn">Sign out</button>
        </div>
      `;

      document.querySelectorAll('.category-card').forEach((card) => {
        card.addEventListener('click', () => openRequest(card.dataset.category));
      });

      document.getElementById('requestBtn').addEventListener('click', () => openRequest('General Assistance'));
      document.getElementById('notificationLink').addEventListener('click', () => renderNotifications());
      document.getElementById('logoutBtn').addEventListener('click', () => {
        clearSession();
        renderLogin();
      });
    }

    function renderNotifications() {
      const list = getNotifications();
      app.innerHTML = `
        <div class="card">
          <div class="summary-row">
            <h2 style="margin:0; color: var(--gold);">Notifications</h2>
            <button class="secondary" id="backHome" style="margin:0; width:auto; padding:8px 12px; font-size:0.85rem;">Back</button>
          </div>
          <div class="notification-list">
            ${list.map((note) => `
              <div class="notification-item">
                <strong>${note.title}</strong>
                <div class="small" style="margin-top:6px;">${note.detail}</div>
                <div class="small" style="margin-top:6px;">${new Date(note.createdAt).toLocaleString()}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;

      document.getElementById('backHome').addEventListener('click', renderHome);
    }

    function renderServices() {
      app.innerHTML = `
        <div class="card">
          <div class="summary-row">
            <h2 style="margin:0; color: var(--gold);">Our Services</h2>
            <button class="secondary" id="backHome" style="margin:0; width:auto; padding:8px 12px; font-size:0.85rem;">Back</button>
          </div>
          <div class="category-grid">
            ${serviceCategoryMarkup()}
          </div>
        </div>
      `;

      document.querySelectorAll('.category-card').forEach((card) => {
        card.addEventListener('click', () => openRequest(card.dataset.category));
      });

      document.getElementById('backHome').addEventListener('click', renderHome);
    }

    function renderRequests() {
      const fallback = getTickets();
      const items = fallback.length ? fallback.slice().reverse().map((t) => `
        <div class="request-item">
          <strong>${t.service}</strong>
          <div class="small">${t.number} • ${new Date(t.date).toLocaleString()}</div>
          <div class="small" style="margin-top:8px;">${t.message || t.request || ''}</div>
          <span class="status">${t.status}</span>
        </div>
      `).join('') : '<p class="small">No requests yet. Submit your first request below.</p>';

      app.innerHTML = `
        <div class="card">
          <div class="summary-row">
            <h2 style="margin:0; color: var(--gold);">My Requests</h2>
            <button class="secondary" id="newRequestBtn" style="margin:0; width:auto; padding:8px 12px; font-size:0.85rem;">New</button>
          </div>
          <div class="request-list">
            ${items}
          </div>
          <button class="primary" id="requestBtn">Make a request</button>
        </div>
      `;

      document.getElementById('newRequestBtn').addEventListener('click', () => openRequest('General Assistance'));
      document.getElementById('requestBtn').addEventListener('click', () => openRequest('General Assistance'));
    }

    function renderAccount() {
      const account = getAccount();
      const profile = JSON.parse(localStorage.getItem('scentcafe_session') || '{"name":"Customer","email":"customer@scentcafe.com"}');

      app.innerHTML = `
        <div class="card">
          <div class="summary-row">
            <h2 style="margin:0; color: var(--gold);">My Account</h2>
            <button class="secondary" id="homeBtn" style="margin:0; width:auto; padding:8px 12px; font-size:0.85rem;">Home</button>
          </div>

          <div class="profile-box">
            <h3 style="color: var(--gold); margin-bottom:10px;">Profile</h3>
            <label>Name</label>
            <input id="profileName" value="${profile.name || account.name || 'Customer'}" />

            <label>Email</label>
            <input id="profileEmail" type="email" value="${profile.email || account.email || ''}" />

            <div class="toggle-row">
              <span>Email alerts</span>
              <button class="toggle ${account.emailAlerts ? 'on' : ''}" data-key="emailAlerts" type="button"></button>
            </div>

            <div class="toggle-row">
              <span>SMS alerts</span>
              <button class="toggle ${account.smsAlerts ? 'on' : ''}" data-key="smsAlerts" type="button"></button>
            </div>
          </div>

          <button class="primary" id="saveProfileBtn">Save profile</button>
          <button class="secondary" id="logoutBtn">Sign out</button>
        </div>
      `;

      document.getElementById('homeBtn').addEventListener('click', renderHome);

      document.querySelectorAll('.toggle').forEach((toggle) => {
        toggle.addEventListener('click', () => {
          toggle.classList.toggle('on');
        });
      });

      document.getElementById('saveProfileBtn').addEventListener('click', async () => {
        const next = getAccount();
        next.name = document.getElementById('profileName').value.trim() || next.name;
        next.email = document.getElementById('profileEmail').value.trim() || next.email;
        next.emailAlerts = document.querySelector('[data-key="emailAlerts"]').classList.contains('on');
        next.smsAlerts = document.querySelector('[data-key="smsAlerts"]').classList.contains('on');

        try {
          const data = await apiRequest('/api/profile', {
            method: 'PUT',
            body: JSON.stringify({
              firstName: next.name.split(' ')[0] || next.name,
              lastName: next.name.split(' ').slice(1).join(' ') || '',
              email: next.email
            })
          });

          saveAccount(next);
          localStorage.setItem('scentcafe_session', JSON.stringify({
            name: data.user.name || next.name,
            email: data.user.email || next.email
          }));
          addNotification('Profile saved', 'Your account preferences were updated successfully.');
          renderAccount();
        } catch (error) {
          renderError(error.message || 'Unable to save profile.');
        }
      });

      document.getElementById('logoutBtn').addEventListener('click', () => {
        clearSession();
        renderLogin();
      });
    }

    function getCategoryLabel(key) {
      const found = defaultCategories.find((category) => category.key === key);
      return found ? found.title : 'General Assistance';
    }

    function openRequest(serviceName) {
      const normalized = typeof serviceName === 'string' ? serviceName : 'General Assistance';
      const mappedService = defaultCategories.some((category) => category.key === normalized)
        ? getCategoryLabel(normalized)
        : getCategoryLabel(normalized.toLowerCase().replace(/\s+/g, '')) || normalized;

      app.innerHTML = `
        <div class="card">
          <div class="summary-row">
            <h2 style="margin:0; color: var(--gold);">New Request</h2>
            <button class="secondary" id="backBtn" style="margin:0; width:auto; padding:8px 12px; font-size:0.85rem;">Back</button>
          </div>

          <label>Name</label>
          <input id="requestName" value="${(JSON.parse(localStorage.getItem('scentcafe_session') || '{"name":"Customer"}')).name || getAccount().name}" />

          <label>Phone Number</label>
          <input id="requestPhone" placeholder="Your phone number" />

          <label>Service</label>
          <input id="requestService" value="${mappedService}" />

          <label>What do you need help with?</label>
          <textarea id="requestMessage" placeholder="Tell us what you need help with"></textarea>

          <button class="primary" id="submitRequestBtn">Submit Request</button>
        </div>
      `;

      document.getElementById('backBtn').addEventListener('click', renderHome);

      document.getElementById('submitRequestBtn').addEventListener('click', async () => {
        const name = document.getElementById('requestName').value.trim();
        const phone = document.getElementById('requestPhone').value.trim();
        const service = document.getElementById('requestService').value.trim() || 'General Assistance';
        const message = document.getElementById('requestMessage').value.trim();

        if (!name || !phone || !message) {
          renderError('Please complete all fields.');
          return;
        }

        try {
          const data = await apiRequest('/api/requests', {
            method: 'POST',
            body: JSON.stringify({ name, phone, service, request: message })
          });

          addNotification('Request submitted', `Ticket ${data.ticket.number} was created for ${service}.`);
          renderRequests();
        } catch (error) {
          renderError(error.message || 'Unable to submit request.');
        }
      });
    }

    async function verifySession() {
      const token = getToken();
      if (!token) return false;

      try {
        const data = await apiRequest('/api/session');
        localStorage.setItem('scentcafe_session', JSON.stringify({
          name: data.user.name || 'Customer',
          email: data.user.email || getAccount().email
        }));
        return true;
      } catch (error) {
        clearSession();
        return false;
      }
    }

    async function initApp() {
      const sessionValid = await verifySession();

      if (!sessionValid) {
        renderLogin();
        return;
      }

      renderHome();
    }

    initApp();
  </script>

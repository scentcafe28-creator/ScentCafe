<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScentCafe</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #07111f;
  color: white;
  min-height: 100vh;
}

.app {
  max-width: 480px;
  margin: auto;
  min-height: 100vh;
  padding-bottom: 75px;
}

header {
  background: #0b1728;
  padding: 20px;
  border-bottom: 1px solid #c9a227;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  color: #d4af37;
  font-size: 25px;
  font-weight: bold;
}

.header-icon {
  color: #d4af37;
  font-size: 22px;
}

.page {
  padding: 20px;
}

.hero {
  background: linear-gradient(145deg, #10233c, #07111f);
  border: 1px solid #c9a227;
  border-radius: 18px;
  padding: 25px 20px;
  margin-bottom: 20px;
}

.hero h1 {
  color: #d4af37;
  margin-bottom: 10px;
}

.hero p {
  color: #c8ced8;
  line-height: 1.5;
}

.section-title {
  margin: 22px 0 12px;
  color: #d4af37;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.card {
  background: #0d1b2d;
  border: 1px solid #263b55;
  border-radius: 15px;
  padding: 18px 14px;
  cursor: pointer;
  transition: .2s;
}

.card:hover {
  border-color: #d4af37;
  transform: translateY(-2px);
}

.card-icon {
  font-size: 28px;
  margin-bottom: 10px;
}

.card h3 {
  font-size: 15px;
  margin-bottom: 6px;
}

.card p {
  color: #9fa9b7;
  font-size: 12px;
  line-height: 1.4;
}

.gold {
  color: #d4af37;
}

.service-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.service {
  background: #0d1b2d;
  border: 1px solid #263b55;
  padding: 16px;
  border-radius: 14px;
  cursor: pointer;
}

.service:hover {
  border-color: #d4af37;
}

.service strong {
  display: block;
  margin-bottom: 5px;
}

.service span {
  color: #9fa9b7;
  font-size: 13px;
}

button {
  border: none;
  cursor: pointer;
}

.primary-btn {
  width: 100%;
  padding: 15px;
  border-radius: 12px;
  background: #d4af37;
  color: #07111f;
  font-weight: bold;
  margin-top: 15px;
}

.secondary-btn {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  background: #13243a;
  color: white;
  border: 1px solid #30455f;
  margin-top: 10px;
}

.ticket {
  background: #0d1b2d;
  border: 1px solid #263b55;
  border-radius: 15px;
  padding: 17px;
  margin-bottom: 12px;
}

.ticket-number {
  color: #d4af37;
  font-weight: bold;
  margin-bottom: 7px;
}

.ticket-status {
  display: inline-block;
  margin-top: 10px;
  padding: 5px 9px;
  border-radius: 20px;
  background: #172c44;
  color: #d4af37;
  font-size: 12px;
}

input,
textarea {
  width: 100%;
  background: #091626;
  color: white;
  border: 1px solid #30455f;
  border-radius: 10px;
  padding: 13px;
  margin-top: 7px;
  margin-bottom: 14px;
  font-family: inherit;
}

textarea {
  min-height: 120px;
  resize: vertical;
}

label {
  font-size: 13px;
  color: #c8ced8;
}

.empty {
  text-align: center;
  padding: 40px 15px;
  color: #8f9aaa;
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  height: 65px;
  background: #0b1728;
  border-top: 1px solid #263b55;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 10;
}

.nav-btn {
  background: none;
  color: #8290a2;
  font-size: 11px;
  text-align: center;
}

.nav-btn div {
  font-size: 21px;
  margin-bottom: 3px;
}

.nav-btn.active {
  color: #d4af37;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.75);
  z-index: 20;
  padding: 20px;
  align-items: center;
  justify-content: center;
}

.modal-box {
  width: 100%;
  max-width: 440px;
  background: #0d1b2d;
  border: 1px solid #d4af37;
  border-radius: 18px;
  padding: 22px;
  max-height: 90vh;
  overflow-y: auto;
}

.modal-box h2 {
  color: #d4af37;
  margin-bottom: 18px;
}

.close {
  float: right;
  background: none;
  color: white;
  font-size: 25px;
}

.back {
  color: #d4af37;
  cursor: pointer;
  margin-bottom: 18px;
  display: inline-block;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">ScentCafe</div>
  <div class="header-icon">✦</div>
</header>

<main id="app"></main>

</div>

<nav class="bottom-nav">

  <button class="nav-btn active" onclick="showPage('home')">
    <div>⌂</div>
    Home
  </button>

  <button class="nav-btn" onclick="showPage('services')">
    <div>▦</div>
    Services
  </button>

  <button class="nav-btn" onclick="showPage('requests')">
    <div>✓</div>
    Requests
  </button>

  <button class="nav-btn" onclick="showPage('account')">
    <div>●</div>
    Account
  </button>

</nav>

<div class="modal" id="requestModal">

  <div class="modal-box">

    <button class="close" onclick="closeRequest()">×</button>

    <h2>Create Request</h2>

    <label>Your Name</label>
    <input id="customerName" type="text" placeholder="Enter your name">

    <label>Phone Number</label>
    <input id="customerPhone" type="tel" placeholder="Enter your phone number">

    <label>What do you need help with?</label>
    <textarea id="customerRequest"
      placeholder="Describe what you need help with..."></textarea>

    <button class="primary-btn" onclick="createTicket()">
      Submit Request
    </button>

  </div>

</div>

<script>

let currentPage = "home";

function getTickets() {
  return JSON.parse(localStorage.getItem("scentcafeTickets") || "[]");
}

function saveTickets(tickets) {
  localStorage.setItem("scentcafeTickets", JSON.stringify(tickets));
}

function showPage(page) {

  currentPage = page;

  document.querySelectorAll(".nav-btn").forEach(btn => {
    btn.classList.remove("active");
  });

  if (page === "home") {
    document.querySelectorAll(".nav-btn")[0].classList.add("active");
  }

  if (page === "services") {
    document.querySelectorAll(".nav-btn")[1].classList.add("active");
  }

  if (page === "requests") {
    document.querySelectorAll(".nav-btn")[2].classList.add("active");
  }

  if (page === "account") {
    document.querySelectorAll(".nav-btn")[3].classList.add("active");
  }

  render();
}

function render() {

  const app = document.getElementById("app");

  if (currentPage === "home") {

    app.innerHTML = `

      <div class="page">

        <div class="hero">
          <h1>Welcome to ScentCafe</h1>
          <p>
            Your digital service centre. Get assistance with
            government services, jobs, CVs, education and applications.
          </p>

          <button class="primary-btn"
            onclick="openRequest()">
            Make a Request
          </button>
        </div>

        <h2 class="section-title">Our Services</h2>

        <div class="grid">

          <div class="card" onclick="showPage('government')">
            <div class="card-icon">🏛️</div>
            <h3>Government</h3>
            <p>Get help with government services.</p>
          </div>

          <div class="card" onclick="showPage('jobs')">
            <div class="card-icon">💼</div>
            <h3>Jobs & CVs</h3>
            <p>Job applications and CV assistance.</p>
          </div>

          <div class="card" onclick="showPage('education')">
            <div class="card-icon">🎓</div>
            <h3>Education</h3>
            <p>Student and education assistance.</p>
          </div>

          <div class="card" onclick="showPage('applications')">
            <div class="card-icon">📄</div>
            <h3>Applications</h3>
            <p>Help with online applications.</p>
          </div>

        </div>

        <h2 class="section-title">My Requests</h2>

        <div class="card" onclick="showPage('requests')">
          <div class="card-icon">📋</div>
          <h3>Track My Requests</h3>
          <p>View your submitted requests and ticket numbers.</p>
        </div>

      </div>

    `;

  }

  else if (currentPage === "services") {

    app.innerHTML = `

      <div class="page">

        <h1 class="gold">Services</h1>

        <p style="color:#9fa9b7;margin:10px 0 20px;">
          Select a service and create a request.
        </p>

        <div class="service-list">

          <div class="service" onclick="openService('Government Services')">
            <strong>🏛️ Government Services</strong>
            <span>Assistance with government-related services.</span>
          </div>

          <div class="service" onclick="openService('Jobs & CVs')">
            <strong>💼 Jobs & CVs</strong>
            <span>CV creation, job applications and career assistance.</span>
          </div>

          <div class="service" onclick="openService('Education')">
            <strong>🎓 Education</strong>
            <span>Student applications and education assistance.</span>
          </div>

          <div class="service" onclick="openService('Applications')">
            <strong>📄 Applications</strong>
            <span>Help with online forms and applications.</span>
          </div>

        </div>

      </div>

    `;

  }

  else if (currentPage === "government") {

    app.innerHTML = `

      <div class="page">

        <div class="back" onclick="showPage('services')">
          ← Back
        </div>

        <h1 class="gold">Government Services</h1>

        <p style="color:#9fa9b7;margin:10px 0 20px;">
          Choose the government service you need help with.
        </p>

        <div class="service-list">

          <div class="service" onclick="openService('SASSA Assistance')">
            <strong>SASSA Assistance</strong>
            <span>Help with SASSA-related applications.</span>
          </div>

          <div class="service" onclick="openService('Home Affairs')">
            <strong>Home Affairs</strong>
            <span>Assistance with Home Affairs services.</span>
          </div>

          <div class="service" onclick="openService('SARS')">
            <strong>SARS</strong>
            <span>Tax and SARS assistance.</span>
          </div>

          <div class="service" onclick="openService('PSIRA')">
            <strong>PSIRA</strong>
            <span>PSIRA application assistance.</span>
          </div>

          <div class="service" onclick="openService('NSFAS')">
            <strong>NSFAS</strong>
            <span>NSFAS application and student funding assistance.</span>
          </div>

          <div class="service" onclick="openService('CIPC / BizPortal')">
            <strong>CIPC / BizPortal</strong>
            <span>Business registration assistance.</span>
          </div>

          <div class="service" onclick="openService('Other Government Service')">
            <strong>Other Government Service</strong>
            <span>Request assistance with another service.</span>
          </div>

        </div>

      </div>

    `;

  }

  else if (currentPage === "jobs") {

    app.innerHTML = `

      <div class="page">

        <div class="back" onclick="showPage('services')">
          ← Back
        </div>

        <h1 class="gold">Jobs & CVs</h1>

        <div class="service-list" style="margin-top:20px;">

          <div class="service" onclick="openService('CV Creation')">
            <strong>📄 CV Creation</strong>
            <span>Create or improve your CV.</span>
          </div>

          <div class="service" onclick="openService('Job Application')">
            <strong>💼 Job Application</strong>
            <span>Get assistance applying for jobs.</span>
          </div>

          <div class="service" onclick="openService('Job Search')">
            <strong>🔎 Job Search</strong>
            <span>Get help finding suitable opportunities.</span>
          </div>

        </div>

      </div>

    `;

  }

  else if (currentPage === "education") {

    app.innerHTML = `

      <div class="page">

        <div class="back" onclick="showPage('services')">
          ← Back
        </div>

        <h1 class="gold">Education</h1>

        <div class="service-list" style="margin-top:20px;">

          <div class="service" onclick="openService('University Application')">
            <strong>🎓 University Application</strong>
            <span>Assistance with university applications.</span>
          </div>

          <div class="service" onclick="openService('College Application')">
            <strong>🏫 College Application</strong>
            <span>Assistance with college applications.</span>
          </div>

          <div class="service" onclick="openService('School Admission')">
            <strong>📚 School Admission</strong>
            <span>Help with school admission applications.</span>
          </div>

        </div>

      </div>

    `;

  }

  else if (currentPage === "applications") {

    app.innerHTML = `

      <div class="page">

        <div class="back" onclick="showPage('services')">
          ← Back
        </div>

        <h1 class="gold">Applications</h1>

        <div class="service-list" style="margin-top:20px;">

          <div class="service" onclick="openService('Online Application')">
            <strong>📝 Online Application</strong>
            <span>Get help completing an online application.</span>
          </div>

          <div class="service" onclick="openService('Document Assistance')">
            <strong>📁 Document Assistance</strong>
            <span>Help preparing documents for applications.</span>
          </div>

          <div class="service" onclick="openService('Other Application')">
            <strong>📋 Other Application</strong>
            <span>Request assistance with another application.</span>
          </div>

        </div>

      </div>

    `;

  }

  else if (currentPage === "requests") {

    const tickets = getTickets();

    let content = "";

    if (tickets.length === 0) {

      content = `
        <div class="empty">
          <div style="font-size:45px;">📋</div>
          <h3>No requests yet</h3>
          <p style="margin-top:8px;">
            Your submitted requests will appear here.
          </p>

          <button class="primary-btn"
            onclick="openRequest()">
            Create Request
          </button>
        </div>
      `;

    } else {

      tickets.reverse().forEach(ticket => {

        content += `

          <div class="ticket">

            <div class="ticket-number">
              ${ticket.number}
            </div>

            <strong>${ticket.service}</strong>

            <p style="color:#9fa9b7;margin-top:7px;">
              ${ticket.request}
            </p>

            <span class="ticket-status">
              ${ticket.status}
            </span>

          </div>

        `;

      });

    }

    app.innerHTML = `

      <div class="page">

        <h1 class="gold">My Requests</h1>

        <p style="color:#9fa9b7;margin:10px 0 20px;">
          Track your ScentCafe requests.
        </p>

        ${content}

      </div>

    `;

  }

  else if (currentPage === "account") {

    app.innerHTML = `

      <div class="page">

        <h1 class="gold">My Account</h1>

        <div class="hero" style="margin-top:20px;">

          <div style="font-size:50px;">👤</div>

          <h2 style="margin-top:12px;">
            ScentCafe Customer
          </h2>

          <p style="margin-top:8px;">
            Your account and service requests.
          </p>

        </div>

        <button class="primary-btn"
          onclick="openRequest()">
          Make a Request
        </button>

        <button class="secondary-btn"
          onclick="showPage('requests')">
          View My Requests
        </button>

      </div>

    `;

  }

}

function openService(service) {

  document.getElementById("requestModal").style.display = "flex";

  document.getElementById("customerRequest").value =
    "I need assistance with " + service + ".";

}

function openRequest() {

  document.getElementById("requestModal").style.display = "flex";

}

function closeRequest() {

  document.getElementById("requestModal").style.display = "none";

}

function createTicket() {

  const name =
    document.getElementById("customerName").value.trim();

  const phone =
    document.getElementById("customerPhone").value.trim();

  const request =
    document.getElementById("customerRequest").value.trim();

  if (!name || !phone || !request) {

    alert("Please complete all fields.");

    return;
  }

  const tickets = getTickets();

  const number =
    "SC-" +
    new Date().getFullYear() +
    "-" +
    String(tickets.length + 1).padStart(4, "0");

  tickets.push({

    number: number,

    name: name,

    phone: phone,

    request: request,

    service: "ScentCafe Service",

    status: "Received",

    date: new Date().toLocaleString()

  });

  saveTickets(tickets);

  document.getElementById("customerName").value = "";
  document.getElementById("customerPhone").value = "";
  document.getElementById("customerRequest").value = "";

  closeRequest();

  alert(
    "Request submitted successfully!\n\n" +
    "Your ticket number is: " + number
  );

  showPage("requests");

}

render();

</script>

</body>
</html>

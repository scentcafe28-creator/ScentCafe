<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScentCafe</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #07111f;
  color: white;
  min-height: 100vh;
}

.app {
  max-width: 480px;
  margin: auto;
  min-height: 100vh;
  padding-bottom: 75px;
}

header {
  background: #0b1728;
  padding: 20px;
  border-bottom: 1px solid #c9a227;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  color: #d4af37;
  font-size: 25px;
  font-weight: bold;
}

.header-icon {
  color: #d4af37;
  font-size: 22px;
}

.page {
  padding: 20px;
}

.hero {
  background: linear-gradient(145deg, #10233c, #07111f);
  border: 1px solid #c9a227;
  border-radius: 18px;
  padding: 25px 20px;
  margin-bottom: 20px;
}

.hero h1 {
  color: #d4af37;
  margin-bottom: 10px;
}

.hero p {
  color: #c8ced8;
  line-height: 1.5;
}

.section-title {
  margin: 22px 0 12px;
  color: #d4af37;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.card {
  background: #0d1b2d;
  border: 1px solid #263b55;
  border-radius: 15px;
  padding: 18px 14px;
  cursor: pointer;
  transition: .2s;
}

.card:hover {
  border-color: #d4af37;
  transform: translateY(-2px);
}

.card-icon {
  font-size: 28px;
  margin-bottom: 10px;
}

.card h3 {
  font-size: 15px;
  margin-bottom: 6px;
}

.card p {
  color: #9fa9b7;
  font-size: 12px;
  line-height: 1.4;
}

.gold {
  color: #d4af37;
}

.service-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.service {
  background: #0d1b2d;
  border: 1px solid #263b55;
  padding: 16px;
  border-radius: 14px;
  cursor: pointer;
}

.service:hover {
  border-color: #d4af37;
}

.service strong {
  display: block;
  margin-bottom: 5px;
}

.service span {
  color: #9fa9b7;
  font-size: 13px;
}

button {
  border: none;
  cursor: pointer;
}

.primary-btn {
  width: 100%;
  padding: 15px;
  border-radius: 12px;
  background: #d4af37;
  color: #07111f;
  font-weight: bold;
  margin-top: 15px;
}

.secondary-btn {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  background: #13243a;
  color: white;
  border: 1px solid #30455f;
  margin-top: 10px;
}

.auth-card {
  background: #0d1b2d;
  border: 1px solid #d4af37;
  border-radius: 18px;
  padding: 24px 18px;
  margin-top: 20px;
}

.auth-badge {
  display: inline-block;
  background: rgba(212, 175, 55, 0.15);
  color: #d4af37;
  border: 1px solid rgba(212, 175, 55, 0.35);
  border-radius: 999px;
  padding: 7px 12px;
  font-size: 12px;
  margin-bottom: 12px;
}

.demo-credentials {
  margin-top: 14px;
  padding: 12px;
  border-radius: 10px;
  background: #091626;
  border: 1px solid #30455f;
  color: #c8ced8;
  font-size: 12px;
  line-height: 1.6;
}

.link-btn {
  display: inline-block;
  margin-top: 12px;
  color: #d4af37;
  background: none;
  border: none;
  font-weight: bold;
  cursor: pointer;
}

.form-row {
  display: flex;
  gap: 10px;
}

.form-row > * {
  flex: 1;
}

.ticket {
  background: #0d1b2d;
  border: 1px solid #263b55;
  border-radius: 15px;
  padding: 17px;
  margin-bottom: 12px;
}

.ticket-number {
  color: #d4af37;
  font-weight: bold;
  margin-bottom: 7px;
}

.ticket-status {
  display: inline-block;
  margin-top: 10px;
  padding: 5px 9px;
  border-radius: 20px;
  background: #172c44;
  color: #d4af37;
  font-size: 12px;
}

input,
textarea {
  width: 100%;
  background: #091626;
  color: white;
  border: 1px solid #30455f;
  border-radius: 10px;
  padding: 13px;
  margin-top: 7px;
  margin-bottom: 14px;
  font-family: inherit;
}

textarea {
  min-height: 120px;
  resize: vertical;
}

label {
  font-size: 13px;
  color: #c8ced8;
}

.empty {
  text-align: center;
  padding: 40px 15px;
  color: #8f9aaa;
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  height: 65px;
  background: #0b1728;
  border-top: 1px solid #263b55;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 10;
}

.nav-btn {
  background: none;
  color: #8290a2;
  font-size: 11px;
  text-align: center;
}

.nav-btn div {
  font-size: 21px;
  margin-bottom: 3px;
}

.nav-btn.active {
  color: #d4af37;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.75);
  z-index: 20;
  padding: 20px;
  align-items: center;
  justify-content: center;
}

.modal-box {
  width: 100%;
  max-width: 440px;
  background: #0d1b2d;
  border: 1px solid #d4af37;
  border-radius: 18px;
  padding: 22px;
  max-height: 90vh;
  overflow-y: auto;
}

.modal-box h2 {
  color: #d4af37;
  margin-bottom: 18px;
}

.close {
  float: right;
  background: none;
  color: white;
  font-size: 25px;
}

.back {
  color: #d4af37;
  cursor: pointer;
  margin-bottom: 18px;
  display: inline-block;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">ScentCafe</div>
  <div class="header-icon">✦</div>
</header>

<main id="app"></main>

</div>

<nav class="bottom-nav">

  <button class="nav-btn active" onclick="showPage('home')">
    <div>⌂</div>
    Home
  </button>

  <button class="nav-btn" onclick="showPage('services')">
    <div>▦</div>
    Services
  </button>

  <button class="nav-btn" onclick="showPage('requests')">
    <div>✓</div>
    Requests
  </button>

  <button class="nav-btn" onclick="showPage('account')">
    <div>●</div>
    Account
  </button>

</nav>

<div class="modal" id="requestModal">

  <div class="modal-box">

    <button class="close" onclick="closeRequest()">×</button>

    <h2>Create Request</h2>

    <label>Your Name</label>
    <input id="customerName" type="text" placeholder="Enter your name">

    <label>Phone Number</label>
    <input id="customerPhone" type="tel" placeholder="Enter your phone number">

    <label>What do you need help with?</label>
    <textarea id="customerRequest"
      placeholder="Describe what you need help with..."></textarea>

    <button class="primary-btn" onclick="createTicket()">
      Submit Request
    </button>

  </div>

</div>

<script>

let currentPage = "login";

const STORAGE_KEYS = {
  users: "scentcafeUsers",
  session: "scentcafeSession",
  loggedIn: "scentcafeLoggedIn",
  tickets: "scentcafeTickets"
};

function validateEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function normalizeUser(user) {
  if (!user || typeof user !== "object") return null;

  const firstName = (user.firstName || "").trim();
  const lastName = (user.lastName || "").trim();
  const name = (user.name || `${firstName} ${lastName}`.trim() || "ScentCafe Customer").trim();

  return {
    firstName,
    lastName,
    name,
    email: (user.email || "").toLowerCase().trim(),
    password: user.password || ""
  };
}

function getUsers() {
  const raw = localStorage.getItem(STORAGE_KEYS.users);

  if (!raw) {
    const demoUser = normalizeUser({
      firstName: "ScentCafe",
      lastName: "Customer",
      name: "ScentCafe Customer",
      email: "customer@scentcafe.com",
      password: "password123"
    });

    localStorage.setItem(STORAGE_KEYS.users, JSON.stringify([demoUser]));
    return [demoUser];
  }

  try {
    const users = JSON.parse(raw).map(normalizeUser).filter(Boolean);
    return users;
  } catch (error) {
    return [];
  }
}

function saveUsers(users) {
  localStorage.setItem(STORAGE_KEYS.users, JSON.stringify(users.map(normalizeUser).filter(Boolean)));
}

function getSessionUser() {
  const raw = localStorage.getItem(STORAGE_KEYS.session);
  if (!raw) return null;

  try {
    return normalizeUser(JSON.parse(raw));
  } catch (error) {
    return null;
  }
}

function isLoggedIn() {
  return localStorage.getItem(STORAGE_KEYS.loggedIn) === "true";
}

function setSession(user) {
  const normalized = normalizeUser(user);
  if (!normalized) return;

  localStorage.setItem(STORAGE_KEYS.session, JSON.stringify(normalized));
  localStorage.setItem(STORAGE_KEYS.loggedIn, "true");
}

function logout() {
  localStorage.removeItem(STORAGE_KEYS.loggedIn);
  localStorage.removeItem(STORAGE_KEYS.session);
  showPage("login");
}

function getTickets() {
  return JSON.parse(localStorage.getItem(STORAGE_KEYS.tickets) || "[]");
}

function saveTickets(tickets) {
  localStorage.setItem(STORAGE_KEYS.tickets, JSON.stringify(tickets));
}

const authApi = {
  async login(email, password) {
    const users = getUsers();
    const match = users.find(user => user.email === email.toLowerCase());

    if (!match || match.password !== password) {
      throw new Error("Invalid email or password.");
    }

    setSession(match);
    return match;
  },

  async signup(payload) {
    if (!payload.firstName || !payload.lastName || !payload.email || !payload.password) {
      throw new Error("Please fill in all fields.");
    }

    if (!validateEmail(payload.email)) {
      throw new Error("Please enter a valid email address.");
    }

    if (payload.password.length < 6) {
      throw new Error("Password must be at least 6 characters long.");
    }

    const users = getUsers();
    const exists = users.some(user => user.email === payload.email.toLowerCase());
    if (exists) {
      throw new Error("An account with this email already exists.");
    }

    const user = normalizeUser({
      firstName: payload.firstName,
      lastName: payload.lastName,
      name: `${payload.firstName} ${payload.lastName}`,
      email: payload.email,
      password: payload.password
    });

    users.push(user);
    saveUsers(users);
    setSession(user);
    return user;
  },

  async resetPassword(email, password) {
    if (!email || !password) {
      throw new Error("Please complete all fields.");
    }

    if (!validateEmail(email)) {
      throw new Error("Please enter a valid email address.");
    }

    if (password.length < 6) {
      throw new Error("Password must be at least 6 characters long.");
    }

    const users = getUsers();
    const index = users.findIndex(user => user.email === email.toLowerCase());
    if (index === -1) {
      throw new Error("No account exists for that email address.");
    }

    users[index].password = password;
    saveUsers(users);
    return users[index];
  },

  async updateProfile(profile) {
    if (!profile.firstName || !profile.lastName || !profile.email) {
      throw new Error("Please fill in your name and email.");
    }

    if (!validateEmail(profile.email)) {
      throw new Error("Please enter a valid email address.");
    }

    const users = getUsers();
    const current = getSessionUser();
    const currentEmail = current ? current.email : null;
    const index = users.findIndex(user => user.email === currentEmail);

    const updated = normalizeUser({
      firstName: profile.firstName,
      lastName: profile.lastName,
      name: `${profile.firstName} ${profile.lastName}`,
      email: profile.email,
      password: current ? current.password : profile.password
    });

    if (index === -1) {
      users.push(updated);
    } else {
      users[index] = updated;
    }

    saveUsers(users);
    setSession(updated);
    return updated;
  }
};

function showPage(page) {
  const allowedPublicPages = ["login", "signup", "forgot"];

  if (!isLoggedIn() && !allowedPublicPages.includes(page)) {
    page = "login";
  }

  currentPage = page;

  const nav = document.querySelector(".bottom-nav");
  if (nav) {
    nav.style.display = allowedPublicPages.includes(page) ? "none" : "flex";
  }

  document.querySelectorAll(".nav-btn").forEach(btn => {
    btn.classList.remove("active");
  });

  if (page === "home") {
    document.querySelectorAll(".nav-btn")[0].classList.add("active");
  }

  if (page === "services") {
    document.querySelectorAll(".nav-btn")[1].classList.add("active");
  }

  if (page === "requests") {
    document.querySelectorAll(".nav-btn")[2].classList.add("active");
  }

  if (page === "account") {
    document.querySelectorAll(".nav-btn")[3].classList.add("active");
  }

  render();
}

function render() {
  const app = document.getElementById("app");

  if (currentPage === "login") {
    app.innerHTML = `
      <div class="page">
        <div class="auth-card">
          <span class="auth-badge">Secure login</span>
          <h1 class="gold" style="margin-bottom:10px;">Welcome back</h1>
          <p style="color:#c8ced8;line-height:1.5;">
            Sign in to manage your requests, services and account details.
          </p>

          <label style="display:block;margin-top:20px;">Email address</label>
          <input id="loginEmail" type="email" placeholder="name@example.com">

          <label>Password</label>
          <input id="loginPassword" type="password" placeholder="Enter your password">

          <button class="primary-btn" onclick="handleLogin()">Sign In</button>

          <button class="link-btn" onclick="showPage('signup')">Create account</button>
          <br>
          <button class="link-btn" onclick="showPage('forgot')">Forgot password?</button>

          <div class="demo-credentials">
            Demo login:<br>
            Email: customer@scentcafe.com<br>
            Password: password123
          </div>
        </div>
      </div>
    `;
    return;
  }

  if (currentPage === "signup") {
    app.innerHTML = `
      <div class="page">
        <div class="auth-card">
          <span class="auth-badge">Create account</span>
          <h1 class="gold" style="margin-bottom:10px;">Join ScentCafe</h1>
          <p style="color:#c8ced8;line-height:1.5;">
            Register to access services and manage your requests.
          </p>

          <div class="form-row">
            <div>
              <label>First name</label>
              <input id="signupFirstName" type="text" placeholder="First name">
            </div>
            <div>
              <label>Last name</label>
              <input id="signupLastName" type="text" placeholder="Last name">
            </div>
          </div>

          <label>Email address</label>
          <input id="signupEmail" type="email" placeholder="name@example.com">

          <label>Password</label>
          <input id="signupPassword" type="password" placeholder="Create a password">

          <label>Confirm password</label>
          <input id="signupConfirmPassword" type="password" placeholder="Confirm your password">

          <button class="primary-btn" onclick="handleSignup()">Create Account</button>

          <button class="link-btn" onclick="showPage('login')">Already have an account? Sign in</button>
        </div>
      </div>
    `;
    return;
  }

  if (currentPage === "forgot") {
    app.innerHTML = `
      <div class="page">
        <div class="auth-card">
          <span class="auth-badge">Reset password</span>
          <h1 class="gold" style="margin-bottom:10px;">Forgot your password?</h1>
          <p style="color:#c8ced8;line-height:1.5;">
            Enter your email and choose a new password.
          </p>

          <label style="display:block;margin-top:20px;">Email address</label>
          <input id="resetEmail" type="email" placeholder="name@example.com">

          <label>New password</label>
          <input id="resetPassword" type="password" placeholder="New password">

          <label>Confirm new password</label>
          <input id="resetConfirmPassword" type="password" placeholder="Confirm new password">

          <button class="primary-btn" onclick="handlePasswordReset()">Reset Password</button>

          <button class="link-btn" onclick="showPage('login')">Back to sign in</button>
        </div>
      </div>
    `;
    return;
  }

  const user = getSessionUser();

  if (currentPage === "home") {
    app.innerHTML = `
      <div class="page">
        <div class="hero">
          <h1>Welcome to ScentCafe</h1>
          <p>
            Hello ${user ? user.firstName || user.name.split(" ")[0] : "there"}! Your digital service centre. Get assistance with
            government services, jobs, CVs, education and applications.
          </p>

          <button class="primary-btn" onclick="openRequest()">Make a Request</button>
        </div>

        <h2 class="section-title">Our Services</h2>

        <div class="grid">
          <div class="card" onclick="showPage('government')">
            <div class="card-icon">🏛️</div>
            <h3>Government</h3>
            <p>Get help with government services.</p>
          </div>

          <div class="card" onclick="showPage('jobs')">
            <div class="card-icon">💼</div>
            <h3>Jobs & CVs</h3>
            <p>Job applications and CV assistance.</p>
          </div>

          <div class="card" onclick="showPage('education')">
            <div class="card-icon">🎓</div>
            <h3>Education</h3>
            <p>Student and education assistance.</p>
          </div>

          <div class="card" onclick="showPage('applications')">
            <div class="card-icon">📄</div>
            <h3>Applications</h3>
            <p>Help with online applications.</p>
          </div>
        </div>

        <h2 class="section-title">My Requests</h2>
        <div class="card" onclick="showPage('requests')">
          <div class="card-icon">📋</div>
          <h3>Track My Requests</h3>
          <p>View your submitted requests and ticket numbers.</p>
        </div>
      </div>
    `;
  }

  else if (currentPage === "services") {
    app.innerHTML = `
      <div class="page">
        <h1 class="gold">Services</h1>
        <p style="color:#9fa9b7;margin:10px 0 20px;">Select a service and create a request.</p>

        <div class="service-list">
          <div class="service" onclick="openService('Government Services')">
            <strong>🏛️ Government Services</strong>
            <span>Assistance with government-related services.</span>
          </div>

          <div class="service" onclick="openService('Jobs & CVs')">
            <strong>💼 Jobs & CVs</strong>
            <span>CV creation, job applications and career assistance.</span>
          </div>

          <div class="service" onclick="openService('Education')">
            <strong>🎓 Education</strong>
            <span>Student applications and education assistance.</span>
          </div>

          <div class="service" onclick="openService('Applications')">
            <strong>📄 Applications</strong>
            <span>Help with online forms and applications.</span>
          </div>
        </div>
      </div>
    `;
  }

  else if (currentPage === "government") {
    app.innerHTML = `
      <div class="page">
        <div class="back" onclick="showPage('services')">← Back</div>
        <h1 class="gold">Government Services</h1>
        <p style="color:#9fa9b7;margin:10px 0 20px;">Choose the government service you need help with.</p>

        <div class="service-list">
          <div class="service" onclick="openService('SASSA Assistance')"><strong>SASSA Assistance</strong><span>Help with SASSA-related applications.</span></div>
          <div class="service" onclick="openService('Home Affairs')"><strong>Home Affairs</strong><span>Assistance with Home Affairs services.</span></div>
          <div class="service" onclick="openService('SARS')"><strong>SARS</strong><span>Tax and SARS assistance.</span></div>
          <div class="service" onclick="openService('PSIRA')"><strong>PSIRA</strong><span>PSIRA application assistance.</span></div>
          <div class="service" onclick="openService('NSFAS')"><strong>NSFAS</strong><span>NSFAS application and student funding assistance.</span></div>
          <div class="service" onclick="openService('CIPC / BizPortal')"><strong>CIPC / BizPortal</strong><span>Business registration assistance.</span></div>
          <div class="service" onclick="openService('Other Government Service')"><strong>Other Government Service</strong><span>Request assistance with another service.</span></div>
        </div>
      </div>
    `;
  }

  else if (currentPage === "jobs") {
    app.innerHTML = `
      <div class="page">
        <div class="back" onclick="showPage('services')">← Back</div>
        <h1 class="gold">Jobs & CVs</h1>
        <div class="service-list" style="margin-top:20px;">
          <div class="service" onclick="openService('CV Creation')"><strong>📄 CV Creation</strong><span>Create or improve your CV.</span></div>
          <div class="service" onclick="openService('Job Application')"><strong>💼 Job Application</strong><span>Get assistance applying for jobs.</span></div>
          <div class="service" onclick="openService('Job Search')"><strong>🔎 Job Search</strong><span>Get help finding suitable opportunities.</span></div>
        </div>
      </div>
    `;
  }

  else if (currentPage === "education") {
    app.innerHTML = `
      <div class="page">
        <div class="back" onclick="showPage('services')">← Back</div>
        <h1 class="gold">Education</h1>
        <div class="service-list" style="margin-top:20px;">
          <div class="service" onclick="openService('University Application')"><strong>🎓 University Application</strong><span>Assistance with university applications.</span></div>
          <div class="service" onclick="openService('College Application')"><strong>🏫 College Application</strong><span>Assistance with college applications.</span></div>
          <div class="service" onclick="openService('School Admission')"><strong>📚 School Admission</strong><span>Help with school admission applications.</span></div>
        </div>
      </div>
    `;
  }

  else if (currentPage === "applications") {
    app.innerHTML = `
      <div class="page">
        <div class="back" onclick="showPage('services')">← Back</div>
        <h1 class="gold">Applications</h1>
        <div class="service-list" style="margin-top:20px;">
          <div class="service" onclick="openService('Online Application')"><strong>📝 Online Application</strong><span>Get help completing an online application.</span></div>
          <div class="service" onclick="openService('Document Assistance')"><strong>📁 Document Assistance</strong><span>Help preparing documents for applications.</span></div>
          <div class="service" onclick="openService('Other Application')"><strong>📋 Other Application</strong><span>Request assistance with another application.</span></div>
        </div>
      </div>
    `;
  }

  else if (currentPage === "requests") {
    const tickets = getTickets();
    let content = "";

    if (tickets.length === 0) {
      content = `
        <div class="empty">
          <div style="font-size:45px;">📋</div>
          <h3>No requests yet</h3>
          <p style="margin-top:8px;">Your submitted requests will appear here.</p>
          <button class="primary-btn" onclick="openRequest()">Create Request</button>
        </div>
      `;
    } else {
      tickets.reverse().forEach(ticket => {
        content += `
          <div class="ticket">
            <div class="ticket-number">${ticket.number}</div>
            <strong>${ticket.service}</strong>
            <p style="color:#9fa9b7;margin-top:7px;">${ticket.request}</p>
            <span class="ticket-status">${ticket.status}</span>
          </div>
        `;
      });
    }

    app.innerHTML = `
      <div class="page">
        <h1 class="gold">My Requests</h1>
        <p style="color:#9fa9b7;margin:10px 0 20px;">Track your ScentCafe requests.</p>
        ${content}
      </div>
    `;
  }

  else if (currentPage === "account") {
    app.innerHTML = `
      <div class="page">
        <h1 class="gold">My Account</h1>

        <div class="hero" style="margin-top:20px;">
          <div style="font-size:50px;">👤</div>
          <h2 style="margin-top:12px;">${user ? user.name : "ScentCafe Customer"}</h2>
          <p style="margin-top:8px;">${user ? user.email : "customer@scentcafe.com"}</p>
        </div>

        <div class="auth-card" style="margin-top:0;">
          <label>First name</label>
          <input id="profileFirstName" type="text" value="${user ? user.firstName || "" : ""}">

          <label>Last name</label>
          <input id="profileLastName" type="text" value="${user ? user.lastName || "" : ""}">

          <label>Email address</label>
          <input id="profileEmail" type="email" value="${user ? user.email || "" : ""}">

          <button class="primary-btn" onclick="saveProfile()">Save Profile</button>
        </div>

        <button class="secondary-btn" onclick="openRequest()">Make a Request</button>
        <button class="secondary-btn" onclick="showPage('requests')">View My Requests</button>
        <button class="secondary-btn" onclick="logout()">Sign Out</button>
      </div>
    `;
  }
}

async function handleLogin() {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value.trim();

  if (!email || !password) {
    alert("Please enter both email and password.");
    return;
  }

  try {
    await authApi.login(email.toLowerCase(), password);
    showPage("home");
  } catch (error) {
    alert(error.message || "Login failed.");
  }
}

async function handleSignup() {
  const firstName = document.getElementById("signupFirstName").value.trim();
  const lastName = document.getElementById("signupLastName").value.trim();
  const email = document.getElementById("signupEmail").value.trim();
  const password = document.getElementById("signupPassword").value.trim();
  const confirmPassword = document.getElementById("signupConfirmPassword").value.trim();

  if (!firstName || !lastName || !email || !password || !confirmPassword) {
    alert("Please fill in all fields.");
    return;
  }

  if (password !== confirmPassword) {
    alert("Passwords do not match.");
    return;
  }

  try {
    await authApi.signup({ firstName, lastName, email, password });
    showPage("home");
  } catch (error) {
    alert(error.message || "Sign up failed.");
  }
}

async function handlePasswordReset() {
  const email = document.getElementById("resetEmail").value.trim();
  const password = document.getElementById("resetPassword").value.trim();
  const confirmPassword = document.getElementById("resetConfirmPassword").value.trim();

  if (!email || !password || !confirmPassword) {
    alert("Please complete all fields.");
    return;
  }

  if (password !== confirmPassword) {
    alert("Passwords do not match.");
    return;
  }

  try {
    await authApi.resetPassword(email, password);
    alert("Password reset successful. Please sign in with your new password.");
    showPage("login");
  } catch (error) {
    alert(error.message || "Password reset failed.");
  }
}

async function saveProfile() {
  const user = getSessionUser();
  if (!user) {
    alert("You need to be signed in to update your profile.");
    showPage("login");
    return;
  }

  const firstName = document.getElementById("profileFirstName").value.trim();
  const lastName = document.getElementById("profileLastName").value.trim();
  const email = document.getElementById("profileEmail").value.trim();

  try {
    const updated = await authApi.updateProfile({ firstName, lastName, email });
    alert("Profile updated successfully.");
    setSession(updated);
    showPage("account");
  } catch (error) {
    alert(error.message || "Profile update failed.");
  }
}

function openService(service) {
  document.getElementById("requestModal").style.display = "flex";
  document.getElementById("customerRequest").value = "I need assistance with " + service + ".";
}

function openRequest() {
  document.getElementById("requestModal").style.display = "flex";
}

function closeRequest() {
  document.getElementById("requestModal").style.display = "none";
}

function createTicket() {
  const name = document.getElementById("customerName").value.trim();
  const phone = document.getElementById("customerPhone").value.trim();
  const request = document.getElementById("customerRequest").value.trim();

  if (!name || !phone || !request) {
    alert("Please complete all fields.");
    return;
  }

  const tickets = getTickets();
  const number = "SC-" + new Date().getFullYear() + "-" + String(tickets.length + 1).padStart(4, "0");

  tickets.push({
    number,
    name,
    phone,
    request,
    service: "ScentCafe Service",
    status: "Received",
    date: new Date().toLocaleString()
  });

  saveTickets(tickets);

  document.getElementById("customerName").value = "";
  document.getElementById("customerPhone").value = "";
  document.getElementById("customerRequest").value = "";

  closeRequest();
  alert("Request submitted successfully!\n\nYour ticket number is: " + number);
  showPage("requests");
}

if (isLoggedIn()) {
  const sessionUser = getSessionUser();
  currentPage = sessionUser ? "home" : "login";
} else {
  currentPage = "login";
}

showPage(currentPage);

</script>

</body>
</html>

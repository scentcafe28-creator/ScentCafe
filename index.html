<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ScentCafe digital services and customer app" />
  <meta name="theme-color" content="#C9844B" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ScentCafe" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="apple-touch-icon" href="./icon-192.svg" />
  <title>ScentCafe</title>
  <style>
    :root {
      --bg: #07111f;
      --panel: #0d1b2d;
      --panel-2: #091626;
      --line: #30455f;
      --gold: #d4af37;
      --text: #f3f4f6;
      --muted: #b7c1cf;
      --accent: #c9844b;
      --danger: #ff6b6b;
      --success: #4cd7a2;
      --shadow: rgba(0,0,0,0.18);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: var(--bg);
      padding: 18px 18px 90px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0 16px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.5);
      margin-bottom: 18px;
    }

    .brand {
      font-size: 2.1rem;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: -0.04em;
    }

    .spark {
      font-size: 1.7rem;
      color: var(--gold);
    }

    .card {
      background: rgba(13, 27, 45, 0.9);
      border: 1px solid rgba(212, 175, 55, 0.5);
      border-radius: 18px;
      padding: 22px 18px;
      box-shadow: 0 8px 18px var(--shadow);
    }

    .badge {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.35);
      color: var(--gold);
      font-size: 12px;
      margin-bottom: 12px;
    }

    h1, h2, h3, p { margin-top: 0; }

    h1 {
      font-size: clamp(2.2rem, 6vw, 4rem);
      line-height: 0.95;
      color: var(--gold);
      margin-bottom: 18px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.45;
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    input, textarea, select {
      width: 100%;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px 12px;
      font-size: 1rem;
      outline: none;
      resize: vertical;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(212,175,55,0.15);
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 15px 18px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    button:active { transform: scale(0.99); }

    .primary {
      background: var(--gold);
      color: #0b1728;
      margin-top: 18px;
    }

    .secondary {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text);
      margin-top: 12px;
    }

    .danger {
      background: rgba(255,107,107,0.12);
      border: 1px solid rgba(255,107,107,0.4);
      color: #ffd1d1;
      margin-top: 12px;
    }

    .demo-box {
      margin-top: 18px;
      background: rgba(9, 22, 38, 0.8);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 0.9rem;
    }

    .cta {
      margin-top: 28px;
      font-size: 2.3rem;
      font-weight: 800;
      color: var(--gold);
      line-height: 1.1;
    }

    .install-box, .request-box, .profile-box, .notification-box {
      margin-top: 18px;
      background: rgba(13, 27, 45, 0.9);
      border: 1px solid rgba(212,175,55,0.45);
      border-radius: 16px;
      padding: 18px;
    }

    .install-box .row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .install-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--line);
      font-size: 1.4rem;
    }

    .install-label {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }

    .install-note {
      color: var(--muted);
      margin-top: 8px;
      font-size: 0.92rem;
    }

    .request-list, .notification-list, .category-grid {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .request-item, .notification-item, .category-card {
      background: rgba(9, 22, 38, 0.8);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .category-card {
      cursor: pointer;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .category-icon {
      font-size: 1.7rem;
      margin-bottom: 8px;
    }

    .category-card h4 {
      margin: 0 0 5px;
      color: var(--gold);
    }

    .category-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.5;
    }

    .status {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(212,175,55,0.12);
      color: var(--gold);
      font-size: 12px;
      font-weight: 700;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 26px;
      min-height: 26px;
      border-radius: 999px;
      padding: 4px 8px;
      background: rgba(212,175,55,0.14);
      color: var(--gold);
      font-weight: 800;
      margin-left: 8px;
    }

    .summary-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      color: var(--muted);
    }

    .toggle {
      width: 44px;
      min-width: 44px;
      height: 24px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--line);
      position: relative;
      cursor: pointer;
      padding: 0;
      margin: 0;
    }

    .toggle::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.2s ease;
    }

    .toggle.on {
      background: rgba(76,215,162,0.2);
      border-color: rgba(76,215,162,0.6);
    }

    .toggle.on::after {
      transform: translateX(19px);
      background: var(--success);
    }

    .error {
      color: #ffd1d1;
      background: rgba(255,107,107,0.08);
      border: 1px solid rgba(255,107,107,0.3);
      border-radius: 10px;
      padding: 10px 12px;
      margin-top: 12px;
      font-size: 0.95rem;
    }

    .small {
      font-size: 0.88rem;
      color: var(--muted);
    }

    .hidden { display: none !important; }

    @media (min-width: 640px) {
      body { padding: 24px 0; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">ScentCafe</div>
      <div class="spark">✦</div>
    </div>

    <div id="app"></div>
  </div>

  <script>
    const app = document.getElementById('app');

    const defaultCategories = [
      { key: 'government', title: 'Government', icon: '🏛️', description: 'SASSA, Home Affairs, SARS, NSFAS and more.' },
      { key: 'jobs', title: 'Jobs & CVs', icon: '💼', description: 'CVs, applications and interviews.' },
      { key: 'education', title: 'Education', icon: '🎓', description: 'Admissions and student support services.' },
      { key: 'applications', title: 'Applications', icon: '📄', description: 'Online forms and document help.' }
    ];

    const defaultNotifications = [
      { id: 1, title: 'Request received', detail: 'Your Government request is now in review.', createdAt: new Date().toISOString() },
      { id: 2, title: 'Profile update', detail: 'Your contact details were saved successfully.', createdAt: new Date(Date.now() - 3600000).toISOString() },
      { id: 3, title: 'Service reminder', detail: 'Need support with a document? Submit a new request today.', createdAt: new Date(Date.now() - 86400000).toISOString() }
    ];

    function getToken() {
      return localStorage.getItem('scentcafe_token');
    }

    function saveToken(token) {
      localStorage.setItem('scentcafe_token', token);
    }

    function clearSession() {
      localStorage.removeItem('scentcafe_token');
      localStorage.removeItem('scentcafe_session');
    }

    function getAccount() {
      const saved = JSON.parse(localStorage.getItem('scentcafeAccount') || 'null');
      if (saved) return saved;

      return {
        name: 'Customer',
        email: 'customer@scentcafe.com',
        password: 'password123',
        emailAlerts: true,
        smsAlerts: true,
        preferredCategories: ['government', 'jobs']
      };
    }

    function saveAccount(account) {
      localStorage.setItem('scentcafeAccount', JSON.stringify(account));
    }

    function getNotifications() {
      const notifications = JSON.parse(localStorage.getItem('scentcafeNotifications') || 'null');
      if (Array.isArray(notifications) && notifications.length) return notifications;
      localStorage.setItem('scentcafeNotifications', JSON.stringify(defaultNotifications));
      return defaultNotifications;
    }

    function addNotification(title, detail) {
      const notifications = getNotifications();
      notifications.unshift({
        id: Date.now(),
        title,
        detail,
        createdAt: new Date().toISOString()
      });

      localStorage.setItem('scentcafeNotifications', JSON.stringify(notifications.slice(0, 8)));
    }

    function getTickets() {
      return JSON.parse(localStorage.getItem('scentcafeRequests') || '[]');
    }

    function saveTickets(data) {
      localStorage.setItem('scentcafeRequests', JSON.stringify(data));
    }

    function renderError(message) {
      const existing = document.querySelector('.error');
      if (existing) existing.remove();

      const errorBox = document.createElement('div');
      errorBox.className = 'error';
      errorBox.textContent = message;
      app.prepend(errorBox);
    }

    function renderLogin() {
      app.innerHTML = `
        <div class="card">
          <div class="badge">Secure login</div>
          <h1>Welcome back</h1>
          <p class="subtitle">Sign in to manage your requests, services and account details.</p>

          <label>Email address</label>
          <input id="email" type="email" placeholder="name@example.com" />

          <label>Password</label>
          <input id="password" type="password" placeholder="Enter your password" />

          <button class="primary" id="loginBtn">Sign In</button>
          <button class="secondary" id="signupBtn">Create account</button>

          <div class="demo-box">
            Demo login:<br>
            Email: customer@scentcafe.com<br>
            Password: password123
          </div>
        </div>
      `;

      document.getElementById('loginBtn').addEventListener('click', () => {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        const saved = JSON.parse(localStorage.getItem('scentcafeAccount') || 'null');
        const demo = email === 'customer@scentcafe.com' && password === 'password123';
        const savedLogin = saved && email === saved.email && password === saved.password;

        if (!demo && !savedLogin) {
          renderError('Incorrect email or password.');
          return;
        }

        saveToken('demo-token');
        localStorage.setItem('scentcafe_session', JSON.stringify({ name: saved ? saved.name : 'Customer', email }));
        renderHome();
      });

      document.getElementById('signupBtn').addEventListener('click', () => renderSignup());
    }

    function renderSignup() {
      app.innerHTML = `
        <div class="card">
          <div class="badge">Create account</div>
          <h1>Join ScentCafe</h1>
          <p class="subtitle">Register to access services and manage your requests.</p>

          <label>Full name</label>
          <input id="fullName" placeholder="Your full name" />

          <label>Email address</label>
          <input id="newEmail" type="email" placeholder="name@example.com" />

          <label>Password</label>
          <input id="newPassword" type="password" placeholder="Create a password" />

          <button class="primary" id="createBtn">Create account</button>
          <button class="secondary" id="backBtn">Back to sign in</button>
        </div>
      `;

      document.getElementById('createBtn').addEventListener('click', () => {
        const name = document.getElementById('fullName').value.trim();
        const email = document.getElementById('newEmail').value.trim();
        const password = document.getElementById('newPassword').value;

        if (!name || !email || !password) {
          renderError('Please complete all fields.');
          return;
        }

        saveAccount({
          name,
          email,
          password,
          emailAlerts: true,
          smsAlerts: true,
          preferredCategories: ['government', 'jobs']
        });

        document.getElementById('email').value = email;
        renderLogin();
        alert('Account created successfully. You can now sign in.');
      });

      document.getElementById('backBtn').addEventListener('click', renderLogin);
    }

    function serviceCategoryMarkup() {
      return defaultCategories.map((category) => `
        <div class="category-card" data-category="${category.key}" tabindex="0">
          <div>
            <div class="category-icon">${category.icon}</div>
            <h4>${category.title}</h4>
          </div>
          <p>${category.description}</p>
        </div>
      `).join('');
    }

    function renderHome() {
      const user = JSON.parse(localStorage.getItem('scentcafe_session') || '{"name":"Customer","email":"customer@scentcafe.com"}');
      const notifications = getNotifications().slice(0, 3);

      app.innerHTML = `
        <div>
          <div class="card" style="margin-bottom:18px;">
            <div class="summary-row">
              <h2 style="margin:0; color: var(--gold);">Welcome to ScentCafe</h2>
              <span class="pill">${notifications.length}</span>
            </div>
            <p class="subtitle">Hello ${user.name || 'there'}! Your digital service centre.</p>
            <button class="primary" id="requestBtn">Make a request</button>
          </div>

          <div class="install-box">
            <div class="row">
              <div class="install-icon">G</div>
              <div>
                <div class="install-label">Fast access</div>
                <div class="install-note">ScentCafe works as a quick-access service dashboard for assistance requests.</div>
              </div>
            </div>
          </div>

          <div class="notification-box">
            <div class="summary-row">
              <h3 style="margin:0; color: var(--gold);">Notifications</h3>
              <button class="secondary" id="notificationLink" style="margin:0; width:auto; padding:8px 12px; font-size:0.85rem;">View all</button>
            </div>
            <div class="notification-list">
              ${notifications.map((note) => `
                <div class="notification-item">
                  <strong>${note.title}</strong>
                  <div class="small" style="margin-top:6px;">${note.detail}</div>
                  <div class="small" style="margin-top:6px;">${new Date(note.createdAt).toLocaleDateString()}</div>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="request-box">
            <h3 style="color: var(--gold); margin-bottom:10px;">Popular service categories</h3>
            <div class="category-grid">
              ${serviceCategoryMarkup()}
            </div>
          </div>

          <button class="secondary" id="logoutBtn">Sign out</button>
        </div>
      `;

      document.querySelectorAll('.category-card').forEach((card) => {
        card.addEventListener('click', () => openRequest(card.dataset.category));
      });

      document.getElementById('requestBtn').addEventListener('click', () => openRequest('General Assistance'));
      document.getElementById('notificationLink').addEventListener('click', () => renderNotifications());
      document.getElementById('logoutBtn').addEventListener('click', () => {
        clearSession();
        renderLogin();
      });
    }

    function renderNotifications() {
      const list = getNotifications();
      app.innerHTML = `
        <div class="card">
          <div class="summary-row">
            <h2 style="margin:0; color: var(--gold);">Notifications</h2>
            <button class="secondary" id="backHome" style="margin:0; width:auto; padding:8px 12px; font-size:0.85rem;">Back</button>
          </div>
          <div class="notification-list">
            ${list.map((note) => `
              <div class="notification-item">
                <strong>${note.title}</strong>
                <div class="small" style="margin-top:6px;">${note.detail}</div>
                <div class="small" style="margin-top:6px;">${new Date(note.createdAt).toLocaleString()}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;

      document.getElementById('backHome').addEventListener('click', renderHome);
    }

    function renderServices() {
      app.innerHTML = `
        <div class="card">
          <div class="summary-row">
            <h2 style="margin:0; color: var(--gold);">Our Services</h2>
            <button class="secondary" id="backHome" style="margin:0; width:auto; padding:8px 12px; font-size:0.85rem;">Back</button>
          </div>
          <div class="category-grid">
            ${serviceCategoryMarkup()}
          </div>
        </div>
      `;

      document.querySelectorAll('.category-card').forEach((card) => {
        card.addEventListener('click', () => openRequest(card.dataset.category));
      });

      document.getElementById('backHome').addEventListener('click', renderHome);
    }

    function renderRequests() {
      const list = getTickets();
      const items = list.length ? list.slice().reverse().map((t) => `
        <div class="request-item">
          <strong>${t.service}</strong>
          <div class="small">${t.number} • ${new Date(t.date).toLocaleString()}</div>
          <div class="small" style="margin-top:8px;">${t.message}</div>
          <span class="status">${t.status}</span>
        </div>
      `).join('') : '<p class="small">No requests yet. Submit your first request below.</p>';

      app.innerHTML = `
        <div class="card">
          <div class="summary-row">
            <h2 style="margin:0; color: var(--gold);">My Requests</h2>
            <button class="secondary" id="newRequestBtn" style="margin:0; width:auto; padding:8px 12px; font-size:0.85rem;">New</button>
          </div>
          <div class="request-list">
            ${items}
          </div>
          <button class="primary" id="requestBtn">Make a request</button>
        </div>
      `;

      document.getElementById('newRequestBtn').addEventListener('click', () => openRequest('General Assistance'));
      document.getElementById('requestBtn').addEventListener('click', () => openRequest('General Assistance'));
    }

    function renderAccount() {
      const account = getAccount();
      const profile = JSON.parse(localStorage.getItem('scentcafe_session') || '{"name":"Customer","email":"customer@scentcafe.com"}');

      app.innerHTML = `
        <div class="card">
          <div class="summary-row">
            <h2 style="margin:0; color: var(--gold);">My Account</h2>
            <button class="secondary" id="homeBtn" style="margin:0; width:auto; padding:8px 12px; font-size:0.85rem;">Home</button>
          </div>

          <div class="profile-box">
            <h3 style="color: var(--gold); margin-bottom:10px;">Profile</h3>
            <label>Name</label>
            <input id="profileName" value="${profile.name || account.name || 'Customer'}" />

            <label>Email</label>
            <input id="profileEmail" type="email" value="${profile.email || account.email || ''}" />

            <div class="toggle-row">
              <span>Email alerts</span>
              <button class="toggle ${account.emailAlerts ? 'on' : ''}" data-key="emailAlerts" type="button"></button>
            </div>

            <div class="toggle-row">
              <span>SMS alerts</span>
              <button class="toggle ${account.smsAlerts ? 'on' : ''}" data-key="smsAlerts" type="button"></button>
            </div>
          </div>

          <button class="primary" id="saveProfileBtn">Save profile</button>
          <button class="secondary" id="logoutBtn">Sign out</button>
        </div>
      `;

      document.getElementById('homeBtn').addEventListener('click', renderHome);

      document.querySelectorAll('.toggle').forEach((toggle) => {
        toggle.addEventListener('click', () => {
          toggle.classList.toggle('on');
        });
      });

      document.getElementById('saveProfileBtn').addEventListener('click', () => {
        const next = getAccount();
        next.name = document.getElementById('profileName').value.trim() || next.name;
        next.email = document.getElementById('profileEmail').value.trim() || next.email;
        next.emailAlerts = document.querySelector('[data-key="emailAlerts"]').classList.contains('on');
        next.smsAlerts = document.querySelector('[data-key="smsAlerts"]').classList.contains('on');
        saveAccount(next);

        localStorage.setItem('scentcafe_session', JSON.stringify({
          name: next.name,
          email: next.email
        }));

        addNotification('Profile saved', 'Your account preferences were updated successfully.');
        renderAccount();
      });

      document.getElementById('logoutBtn').addEventListener('click', () => {
        clearSession();
        renderLogin();
      });
    }

    function getCategoryLabel(key) {
      const found = defaultCategories.find((category) => category.key === key);
      return found ? found.title : 'General Assistance';
    }

    function openRequest(serviceName) {
      const normalized = typeof serviceName === 'string' ? serviceName : 'General Assistance';
      const categoryName = getCategoryLabel(normalized.toLowerCase().replace(/\s+/g, ''));
      const mappedService = defaultCategories.some((category) => category.key === normalized)
        ? getCategoryLabel(normalized)
        : categoryName || normalized;

      app.innerHTML = `
        <div class="card">
          <div class="summary-row">
            <h2 style="margin:0; color: var(--gold);">New Request</h2>
            <button class="secondary" id="backBtn" style="margin:0; width:auto; padding:8px 12px; font-size:0.85rem;">Back</button>
          </div>

          <label>Name</label>
          <input id="requestName" value="${(JSON.parse(localStorage.getItem('scentcafe_session') || '{"name":"Customer"}')).name || getAccount().name}" />

          <label>Phone Number</label>
          <input id="requestPhone" placeholder="Your phone number" />

          <label>Service</label>
          <input id="requestService" value="${mappedService}" />

          <label>What do you need help with?</label>
          <textarea id="requestMessage" placeholder="Tell us what you need help with"></textarea>

          <button class="primary" id="submitRequestBtn">Submit Request</button>
        </div>
      `;

      document.getElementById('backBtn').addEventListener('click', renderHome);

      document.getElementById('submitRequestBtn').addEventListener('click', () => {
        const name = document.getElementById('requestName').value.trim();
        const phone = document.getElementById('requestPhone').value.trim();
        const service = document.getElementById('requestService').value.trim() || 'General Assistance';
        const message = document.getElementById('requestMessage').value.trim();

        if (!name || !phone || !message) {
          renderError('Please complete all fields.');
          return;
        }

        const list = getTickets();
        const number = 'SC-' + new Date().getFullYear() + '-' + String(list.length + 1).padStart(4, '0');

        list.push({
          number,
          name,
          phone,
          service,
          message,
          status: 'Received',
          date: new Date().toISOString()
        });

        saveTickets(list);
        addNotification('Request submitted', `Ticket ${number} was created for ${service}.`);
        renderRequests();
        alert('Request submitted successfully!\n\nTicket number: ' + number);
      });
    }

    function initApp() {
      const token = getToken();

      if (!token) {
        renderLogin();
        return;
      }

      renderHome();
    }

    initApp();
  </script>
</body>
</html>
